name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python_version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Setup Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python_version }}
      - name: Fetch lonelypsc
        uses: actions/checkout@v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Lint lonelypsc with black
        run: uv run black --check src/lonelypsc
      - name: Type check lonelypsc with mypy
        working-directory: src
        run: uv run --project .. mypy lonelypsc --explicit-package-bases --disallow-untyped-defs
      - name: Lint lonelypsc with ruff
        run: uv run ruff check --output-format=github src
